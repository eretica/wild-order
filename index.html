<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: ノッチや角の丸みの下まで背景を塗り、ゲームは safe-area の内側に置く（#game-container） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- ホーム画面に追加したとき: 横向きに固定（Android）、ブラウザの枠なしで開く -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#101018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WILD ORDER" />
    <title>WILD ORDER</title>
    <meta name="description" content="神話の魔物を従えて戦うドット絵のRPG。ビーストは自分で戦い、あなたは指示を出す。ブラウザで遊べる。" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- リンクを貼ったときの紹介。og:image は絶対 URL でないと読まれない -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WILD ORDER" />
    <meta property="og:description" content="神話の魔物を従えて戦うドット絵のRPG。ビーストは自分で戦い、あなたは指示を出す。ブラウザで遊べる。" />
    <meta property="og:url" content="https://eretica.github.io/wild-order/" />
    <meta property="og:image" content="https://eretica.github.io/wild-order/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #101018; overflow: hidden; }
      /*
       * ゲームを置く箱。画面の見えている範囲から safe-area（ノッチ、角の丸み）を除いた内側。
       * 100vh は iOS Safari ではアドレスバーが隠れたときの高さになり、真ん中に置いた絵の下が切れるので使わない。
       * 下のホームバーの分は、避けても倍率が下がらないときだけ避ける（touch.ts が .safe-bottom を付ける）
       */
      #game-container {
        position: fixed;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: 0; left: env(safe-area-inset-left, 0px);
      }
      #game-container.safe-bottom { bottom: env(safe-area-inset-bottom, 0px); }
      /* JS が動く前から出す。BootScene が外す。文字はフォントを読む前なので端末の等幅で出る */
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #101018; color: #98a0b8; font: 20px monospace; pointer-events: none;
      }
      #loading img { width: 64px; height: 64px; image-rendering: pixelated; }
      /* タッチ: ダブルタップやピンチの拡大、長押しの選択、引っ張りのスクロールを止める */
      html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      @font-face { font-family: PixelMplus10; src: url(fonts/PixelMplus10-Regular.ttf); }
      /* タッチのときだけ出す「もどる」。ゲームの外の余白に置く（touch.ts） */
      #back-button {
        display: none; position: fixed; z-index: 10; margin: 0; padding: 10px 4px;
        font: 20px PixelMplus10, monospace; color: #e8ecf8; background: #182448;
        border: 2px solid #e8ecf8; outline: 2px solid #080c18; border-radius: 0; touch-action: manipulation;
      }
      #back-button:active { background: #283c78; color: #f8d048; }
      /* 縦持ちのとき（touch.ts が出す） */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 20; align-items: center; justify-content: center;
        background: #101018; color: #98a0b8; font: 20px PixelMplus10, monospace;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DKdbNHzj.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-BwSGr_Za.js">
  </head>
  <body>
    <div id="loading"><img src="favicon-32.png" alt="" /><div>よみこみちゅう…</div></div>
    <div id="game-container"></div>
  </body>
</html>
